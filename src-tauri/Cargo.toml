[package]
name = "sutra-studio"
version = "1.0.0"
description = "SUTRA Autonomous Engineering IDE"
authors = ["SUTRA Team"]
edition = "2021"

[lib]
name = "sutra_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
